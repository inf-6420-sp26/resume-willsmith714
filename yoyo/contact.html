<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="css/styles.css">
        <title>Contact Page</title>
    </head>

    <body>
        <div class="grid-container">    
            <div class="grid-item1">
                <h1>Contact Me!</h1>
            </div>

            <nav class="grid-item2">       
                <a href="guide.html" class="btn">Beginner's Guide</a><br>
                <a href="resources.html" class="btn">Learning Resources</a><br>
                <a href="contact.html" class="btn">Contact Page</a>
            </nav>

            <main class="grid-item3">
            <p>Feel free to contact me if you have any questions!</p>

            <div class="container">
                <form>
                    <div class="field">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="user_name" required placeholder="Your name...">
                    </div>
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="user_email" required placeholder="Your email...">
                    </div>
                    <div class="field">
                        <label for="question">Question/Comment</label>
                        <input type="text" id="question" name="user_question" required placeholder="Your question or comment...">
                    </div>
                    <br>
                    <div class="form-actions">
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
            </main>

            <footer class="grid-item4">
                <p>&copy;: 2026 | Will Smith</p>
            </footer>
        </div>
    </body>
</html>
